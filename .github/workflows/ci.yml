name: Build and native tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential dpkg-dev fprintd git ninja-build pkg-config python3-pip python3-venv python3-dev meson libglib2.0-dev libssl-dev libusb-1.0-0-dev libgusb-dev libjson-glib-dev libcairo2-dev
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: Build backend and run native tests
        run: python3 scripts/build_native.py --clean
      - name: Build Debian package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          python3 scripts/package_deb.py --version "$version"
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: petaicmoc-deb-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: petaicmoc-deb-${{ github.run_number }}
          path: dist
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "PetaIC MOC $GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
